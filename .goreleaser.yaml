# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: PROJECT_NAME

before:
  hooks:
    - go mod tidy

builds:
  - id: BINARY_NAME
    main: ./cmd/BINARY_NAME
    binary: BINARY_NAME
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X MODULE_PATH/internal/version.Version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats: [binary]
    name_template: "BINARY_NAME_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: SHA256SUMS.txt
  algorithm: sha256

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: ORG
    name: GITHUB_REPO
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"

nfpms:
  - id: packages
    ids:
      - BINARY_NAME
    package_name: BINARY_NAME
    file_name_template: "BINARY_NAME_{{ .Version }}_{{ .Arch }}"
    homepage: https://github.com/ORG/GITHUB_REPO
    maintainer: ORG <opensource@example.com>
    description: |-
      PROJECT_NAME — replace with a one-line description for package managers.
    license: MIT
    section: utils
    priority: optional
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/BINARY_NAME/LICENSE
        type: doc
      - src: README.md
        dst: /usr/share/doc/BINARY_NAME/README.md
        type: doc

homebrew_casks:
  - name: BINARY_NAME
    ids:
      - default
    skip_upload: '{{ not (isEnvSet "HOMEBREW_TAP_TOKEN") }}'
    repository:
      owner: ORG
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/ORG/GITHUB_REPO
    description: PROJECT_NAME — short description for Homebrew.
    license: MIT
    commit_author:
      name: GITHUB_REPO-bot
      email: 41898282+github-actions[bot]@users.noreply.github.com
    binaries:
      - BINARY_NAME
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}"]
          end

scoops:
  - name: BINARY_NAME
    ids:
      - default
    skip_upload: '{{ not (isEnvSet "SCOOP_TOKEN") }}'
    repository:
      owner: ORG
      name: scoop-bucket
      token: "{{ .Env.SCOOP_TOKEN }}"
    directory: bucket
    homepage: https://github.com/ORG/GITHUB_REPO
    description: PROJECT_NAME — short description for Scoop.
    license: MIT
    commit_author:
      name: GITHUB_REPO-bot
      email: 41898282+github-actions[bot]@users.noreply.github.com
    url_template: "https://github.com/ORG/GITHUB_REPO/releases/download/{{ .Tag }}/{{ .ArtifactName }}"

snapshot:
  version_template: "{{ .Version }}-next"
